            engine-core/src/main/java/nia/engine/net/RedirectPolicy.kt \
            engine-core/src/test/java/nia/engine/net/CookieJarTest.kt \
            engine-core/src/test/java/nia/engine/net/CorsTest.kt \
            engine-core/src/test/java/nia/engine/net/RedirectPolicyTest.kt \
            engine-core/src/main/java/nia/engine/storage/Storage.kt \
            engine-core/src/main/java/nia/engine/storage/IndexedDb.kt \
            engine-core/src/main/java/nia/engine/storage/StoragePersistence.kt \
            engine-core/src/test/java/nia/engine/storage/StorageTest.kt \
            engine-core/src/test/java/nia/engine/storage/IndexedDbTest.kt \
            engine-core/src/test/java/nia/engine/storage/StoragePersistenceTest.kt \
            engine-core/src/main/java/nia/engine/media/MediaEngine.kt \
            engine-core/src/test/java/nia/engine/media/MediaEngineTest.kt \
            engine-core/src/main/java/nia/engine/media/Subtitles.kt \
            engine-core/src/test/java/nia/engine/media/SubtitlesTest.kt \
            engine-core/src/main/java/nia/engine/media/TorrentSubtitles.kt \
            engine-core/src/test/java/nia/engine/media/TorrentSubtitlesTest.kt \
            engine-core/src/main/java/nia/engine/media/OpenSubtitles.kt \
            engine-core/src/test/java/nia/engine/media/OpenSubtitlesTest.kt \
            engine-core/src/main/java/nia/engine/profile/Profile.kt \
            engine-core/src/test/java/nia/engine/profile/ProfileTest.kt \
            engine-core/src/main/java/nia/engine/profile/Fire.kt \
            engine-core/src/test/java/nia/engine/profile/FireTest.kt \
            engine-core/src/main/java/nia/engine/qa/SiteMatrix.kt \
            engine-core/src/test/java/nia/engine/qa/SiteMatrixTest.kt \
            engine-core/src/main/java/nia/engine/qa/YoutubeMatrix.kt \
            engine-core/src/test/java/nia/engine/qa/YoutubeMatrixTest.kt \
            engine-core/src/main/java/nia/engine/torrent/Bencode.kt \
            engine-core/src/main/java/nia/engine/torrent/Torrent.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentTest.kt \
            engine-core/src/main/java/nia/engine/torrent/TorrentStream.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentStreamTest.kt \
            engine-core/src/main/java/nia/engine/torrent/TorrentNet.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentNetTest.kt \
            engine-core/src/main/java/nia/engine/torrent/TorrentDht.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentDhtTest.kt \
            engine-core/src/main/java/nia/engine/torrent/TorrentUdp.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentUdpTest.kt \
            engine-core/src/main/java/nia/engine/torrent/TorrentMagnet.kt \
            engine-core/src/test/java/nia/engine/torrent/TorrentMagnetTest.kt \
            engine-core/src/main/java/nia/engine/modules/PluginRuntime.kt \
            engine-core/src/test/java/nia/engine/modules/PluginRuntimeTest.kt \
            engine-core/src/main/java/nia/engine/download/DownloadEngine.kt \
            engine-core/src/test/java/nia/engine/download/DownloadEngineTest.kt \
            engine-core/src/main/java/nia/engine/themes/ThemeManager.kt \
            engine-core/src/test/java/nia/engine/themes/ThemeManagerTest.kt \
            engine-core/src/main/java/nia/engine/bookmarks/BookmarkManager.kt \
            engine-core/src/test/java/nia/engine/bookmarks/BookmarkManagerTest.kt \
            app/src/main/java/app/nia/navegador/MainActivity.kt \
            app/src/main/java/app/nia/navegador/PaintView.kt \
            app/src/main/java/app/nia/navegador/DevToolsActivity.kt \
            app/src/main/java/app/nia/navegador/DemoPage.kt \
            app/src/main/java/app/nia/navegador/DevToolsState.kt \
            app/src/main/java/app/nia/navegador/FetchDemoActivity.kt \
            app/src/main/AndroidManifest.xml \
            app/build.gradle \
            contracts/build.gradle \
            build.gradle \
            settings.gradle \
            gradle.properties; do
            if [ ! -s "$f" ]; then
              echo "::error::$f falta o esta vacio tras la importacion/push (roundtrip roto)"
              faltan=1
            fi
          done
          if [ "$faltan" = "0" ]; then
            echo "Roundtrip OK: todas las fuentes esperadas estan presentes."
          fi
          exit $faltan

      - name: Tests unitarios (contracts + engine-core)
        run: gradle --no-daemon :contracts:test :engine-core:test

      - name: Resumen del harness (T004)
        if: always()
        run: |
          if ls contracts/build/test-results/*/TEST-*.xml >/dev/null 2>&1 || ls engine-core/build/test-results/*/TEST-*.xml >/dev/null 2>&1; then
            echo "== Suites XML generadas =="
            head -n 2 contracts/build/test-results/*/TEST-*.xml 2>/dev/null
            head -n 2 engine-core/build/test-results/*/TEST-*.xml 2>/dev/null
          else
            echo "::warning::Sin XML de resultados de tests"
          fi

      - name: Publicar XML de resultados de tests (T004)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: |
            proyecto-android/contracts/build/test-results/*/TEST-*.xml
            proyecto-android/engine-core/build/test-results/*/TEST-*.xml
          if-no-files-found: warn

      - name: Smoke build del APK debug (T003)
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK debug como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador-nia-debug-apk
          path: proyecto-android/app/build/outputs/apk/debug/*.apk
