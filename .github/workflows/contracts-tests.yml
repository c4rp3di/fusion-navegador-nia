            engine-core/src/test/java/nia/engine/js/JsDomBindingsTest.kt \
            engine-core/src/test/java/nia/engine/js/JsQuotasTest.kt \
            engine-core/src/test/java/nia/engine/js/JsEventLoopTest.kt \
            engine-core/src/test/java/nia/engine/js/JsFetchApiTest.kt \
            engine-core/src/test/java/nia/engine/js/JsStorageApiTest.kt \
            engine-core/src/test/java/nia/engine/js/JsDebuggerTest.kt \
            engine-core/src/test/java/nia/engine/js/JsWorkersTest.kt \
            engine-core/src/test/java/nia/engine/js/JsServiceWorkersTest.kt \
            engine-core/src/main/java/nia/engine/broker/BrokerRenderer.kt \
            engine-core/src/test/java/nia/engine/broker/BrokerRendererTest.kt \
            engine-core/src/main/java/nia/engine/config/NiaConfig.kt \
            engine-core/src/test/java/nia/engine/config/NiaConfigTest.kt \
            engine-core/src/main/java/nia/engine/inspector/Inspector.kt \
            engine-core/src/test/java/nia/engine/inspector/InspectorTest.kt \
            engine-core/src/main/java/nia/engine/modules/ModuleRegistry.kt \
            engine-core/src/test/java/nia/engine/modules/ModuleRegistryTest.kt \
            engine-core/src/main/java/nia/engine/devtools/DevToolsModel.kt \
            engine-core/src/main/java/nia/engine/devtools/NetworkPanel.kt \
            engine-core/src/test/java/nia/engine/devtools/DevToolsModelTest.kt \
            engine-core/src/test/java/nia/engine/devtools/NetworkPanelTest.kt \
            engine-core/src/main/java/nia/engine/net/Fetch.kt \
            engine-core/src/main/java/nia/engine/net/HttpCache.kt \
            engine-core/src/test/java/nia/engine/net/FetchManagerTest.kt \
            engine-core/src/main/java/nia/engine/net/HttpTransport.kt \
            engine-core/src/test/java/nia/engine/net/HttpTransportTest.kt \
