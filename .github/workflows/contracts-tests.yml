              echo "::error::$f falta o esta vacio tras la importacion/push (roundtrip roto)"
              faltan=1
            fi
          done
          if [ "$faltan" = "0" ]; then
            echo "Roundtrip OK: todas las fuentes esperadas estan presentes."
          fi
          exit $faltan

      - name: Build info del artefacto (T107, RES-0101)
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "${GITHUB_SHA}" > app/src/main/assets/build-info.txt
          echo "build-info.txt: ${GITHUB_SHA}"

      - name: Tests unitarios (contracts + engine-core)
        run: gradle --no-daemon :contracts:test :engine-core:test

      - name: Capacidades del artefacto (T108, RES-0103)
        run: |
          mkdir -p app/src/main/assets
          {
            echo "http.fetch=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
            echo "html.parser=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
            echo "css.cascade=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
            echo "js.cuotas=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
            echo "cookies.persistencia=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
            echo "marcadores.html=PASS#ci#tests unitarios del build ${GITHUB_SHA}"
          } > app/src/main/assets/capacidades.txt
          echo "capacidades.txt: registro embebido (PASS solo si los tests de este build pasaron)"

      - name: Resumen del harness (T004)
        if: always()
        run: |
          if ls contracts/build/test-results/*/TEST-*.xml >/dev/null 2>&1 || ls engine-core/build/test-results/*/TEST-*.xml >/dev/null 2>&1; then
            echo "== Suites XML generadas =="
            head -n 2 contracts/build/test-results/*/TEST-*.xml 2>/dev/null
            head -n 2 engine-core/build/test-results/*/TEST-*.xml 2>/dev/null
          else
            echo "::warning::Sin XML de resultados de tests"
          fi

      - name: Publicar XML de resultados de tests (T004)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: |
            proyecto-android/contracts/build/test-results/*/TEST-*.xml
            proyecto-android/engine-core/build/test-results/*/TEST-*.xml
          if-no-files-found: warn

      - name: Smoke build del APK debug (T003)
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK debug como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador-nia-debug-apk
          path: proyecto-android/app/build/outputs/apk/debug/*.apk

      - name: Publicar APK debug como release smoke (T067-A, R0162)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls "$GITHUB_WORKSPACE/proyecto-android/app/build/outputs/apk/debug/"*.apk | head -n 1)
          if [ -z "$apk" ] || [ ! -s "$apk" ]; then
            echo "::error::No se encontro el APK debug para publicar"
            exit 1
          fi
          echo "Publicando $apk como release smoke (firma DEBUG, prerelease, NO es la release oficial)."
          gh release delete smoke --yes || true
          git push --delete origin "refs/tags/smoke" || true
          # R0172: nombre de asset UNICO por commit. Con el mismo
          # nombre (app-debug.apk) la descarga del usuario sirvio el
          # APK VIEJO de un build anterior (cache del gestor de
          # descargas o del CDN por URL igual).
          NOMBRE="app-debug-${GITHUB_SHA:0:7}.apk"
          cp "$apk" "$NOMBRE"
          if ! gh release create smoke "$NOMBRE" \
            --title "Navegador NIA - APK debug (smoke T067-A)" \
            --notes "APK con firma DEBUG del commit ${GITHUB_SHA}. Distribucion APK manual (ADR-008). NO es la release oficial del navegador: tag smoke prerelease para el reality smoke con dispositivo." \
            --prerelease; then
            echo "create fallo (posible carrera); se re-borra y reintenta"
            gh release delete smoke --yes || true
            git push --delete origin "refs/tags/smoke" || true
            gh release create smoke "$NOMBRE" \
              --title "Navegador NIA - APK debug (smoke T067-A)" \
              --notes "APK con firma DEBUG del commit ${GITHUB_SHA}. Distribucion APK manual (ADR-008). NO es la release oficial del navegador: tag smoke prerelease para el reality smoke con dispositivo." \
              --prerelease
          fi

