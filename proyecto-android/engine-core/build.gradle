// :engine-core - Kotlin JVM puro, inicio del motor (T010: URL/Origin/Site).
// Sin Android: si algun dia depende de android.*, el modulo esta mal ubicado.
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':contracts')

    // Coordenadas explicitas (R0005): la forma corta kotlin('test') es del DSL Kotlin.
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
}
